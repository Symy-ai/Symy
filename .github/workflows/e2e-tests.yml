name: E2E Tests (Playwright)

# 🔧 架构优化 Round 4: Playwright E2E CI 集成
#
# 工作流:
# 1. 等待 Vercel 部署完成 (120s)
# 2. 运行 3 个 P0 回归 E2E 测试:
#    - p0-1-buy-button: "I choose to buy" 不弹存款对话框
#    - p0-a-gacha-crash: Gacha 故事生成不崩溃
#    - p2-11-fill-history: Deposit 后 Fill history 显示记录
# 3. 上传测试报告 + 截图 artifacts
#
# 触发: push to main (Vercel 部署后自动验证)
# 手动触发: Actions 页面 → "Run workflow"
#
# Secrets 需要 (GitHub repo Settings → Secrets):
#   - E2E_EMAIL: 测试账号邮箱
#   - E2E_PASSWORD: 测试账号密码

on:
  push:
    branches: [main]
  workflow_dispatch: {} # 允许在 Actions 页面手动触发

# 同一分支的新提交取消旧的运行，省额度
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装项目依赖
        run: npm ci

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 等待 Vercel 部署完成
        run: |
          echo "等待 120 秒让 Vercel 完成部署..."
          sleep 120
          echo "Vercel 部署等待完成"

      - name: 运行 E2E 测试
        env:
          E2E_BASE_URL: https://we-me-mvp-git-main-spark-huang-s-projects.vercel.app
          # 🔧 2026-07-15 (CRITICAL-14 修复): 移除硬编码 fallback 凭据
          #   此前 commit 68a7651a 起邮箱/密码明文在 git 历史中
          #   修复: 必须配置 GitHub secrets E2E_EMAIL/E2E_PASSWORD, 否则 workflow fail-closed
          #   🔴 注意: 用户需立即 (1) 在 GitHub repo Settings → Secrets 配置 E2E_EMAIL/E2E_PASSWORD
          #                          (2) 旋转测试账号密码 (历史已泄漏)
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test --reporter=line

      - name: 上传测试报告 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传截图 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            test-results/
            /tmp/symy-smoke-*.png
          retention-days: 7
          if-no-files-found: ignore
