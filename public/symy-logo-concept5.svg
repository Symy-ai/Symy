<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
  <defs>
    <!-- Teal glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#37DCF2" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="520" height="380" fill="#0A2647" rx="20"/>
  
  <!--
    Symy Elephant Logo — Side View
    字母即大象：S=头+鼻, m=身体, yy=腿
    用一条连贯的粗线勾勒，既可读出 Symy 四个字母，又可见一只小象侧面
  -->
  <g filter="url(#glow)" transform="translate(40, 20)">
    
    <!-- ===== S: 头 + 鼻子 ===== -->
    <!-- S的上弧 = 头顶 -->
    <!-- S的下弧 = 鼻子向下卷 -->
    <path d="
      M 75 195
      C 55 195, 40 175, 40 150
      C 40 115, 65 90, 100 85
      C 135 80, 155 95, 158 115
      C 160 130, 152 142, 140 148
    " fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- S的鼻部继续向下卷（象鼻） -->
    <path d="
      M 140 148
      C 155 140, 168 125, 172 108
      C 176 92, 168 78, 155 75
      C 170 78, 185 95, 188 120
      C 190 140, 178 158, 158 168
      L 140 175
    " fill="none" stroke="white" stroke-width="16" stroke-linecap="round"/>
    
    <!-- S鼻尖继续向下（象鼻末端） -->
    <path d="
      M 140 175
      C 120 185, 100 195, 88 210
      C 78 222, 75 235, 82 242
      C 88 248, 98 244, 100 235
      C 102 228, 96 220, 88 218
    " fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
    
    <!-- 象耳（S头部的装饰） -->
    <path d="
      M 105 90
      C 85 82, 68 92, 65 110
      C 62 128, 72 140, 88 138
    " fill="none" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    
    <!-- 眼睛 -->
    <circle cx="120" cy="112" r="7" fill="#0A2647"/>
    <circle cx="122" cy="110" r="2.5" fill="white" opacity="0.95"/>
    
    <!-- ===== m: 圆润身体 ===== -->
    <!-- m的左弧 = 胸部 -->
    <!-- m的右弧 = 臀部 -->
    <!-- m的中间 = 背部连接 -->
    <path d="
      M 158 168
      C 170 172, 190 178, 210 185
      
      C 195 175, 185 155, 190 135
      C 195 115, 215 105, 240 108
      C 265 111, 280 130, 282 155
      C 284 180, 270 200, 245 208
      
      C 260 205, 280 195, 300 180
      C 320 165, 330 145, 328 125
      C 326 105, 310 90, 290 88
      C 270 86, 255 95, 250 112
      
      C 248 125, 258 142, 275 148
    " fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- ===== 第一个 y: 前腿 ===== -->
    <!-- y的竖笔 = 前左腿 -->
    <!-- y的斜笔 = 前右腿 -->
    <path d="
      M 190 185
      L 188 260
      C 187 275, 192 285, 200 285
      C 208 285, 212 275, 210 265
      L 212 195
    " fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 第一个y的左腿脚 -->
    <ellipse cx="198" cy="288" rx="14" ry="7" fill="white" opacity="0.9"/>
    
    <!-- 第一个y的右腿 -->
    <path d="
      M 222 195
      L 240 260
      C 243 273, 250 280, 257 278
      C 264 276, 266 268, 262 258
      L 248 200
    " fill="none" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 第一个y的右腿脚 -->
    <ellipse cx="256" cy="282" rx="12" ry="6" fill="white" opacity="0.9"/>
    
    <!-- ===== 第二个 y: 后腿 ===== -->
    <!-- y的竖笔 = 后左腿 -->
    <!-- y的斜笔 = 后右腿 -->
    <path d="
      M 298 185
      L 302 260
      C 303 275, 308 283, 316 283
      C 324 283, 327 275, 325 265
      L 322 195
    " fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 第二个y的左腿脚 -->
    <ellipse cx="314" cy="286" rx="14" ry="7" fill="white" opacity="0.9"/>
    
    <!-- 第二个y的右腿 -->
    <path d="
      M 330 188
      L 352 255
      C 356 268, 362 275, 370 273
      C 378 271, 380 263, 376 253
      L 358 195
    " fill="none" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 第二个y的右腿脚 -->
    <ellipse cx="368" cy="277" rx="12" ry="6" fill="white" opacity="0.9"/>
    
    <!-- 尾巴（从m身体延伸） -->
    <path d="
      M 328 128
      C 342 118, 355 122, 360 135
      C 363 145, 358 152, 350 148
    " fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    
    <!-- 字母标注（辅助线，展示字母构成） -->
    <!-- S 标注 -->
    <text x="80" y="310" font-family="'SF Mono', 'Fira Code', monospace" font-size="22" fill="#37DCF2" text-anchor="middle" opacity="0.5">S</text>
    <!-- m 标注 -->
    <text x="240" y="310" font-family="'SF Mono', 'Fira Code', monospace" font-size="22" fill="#37DCF2" text-anchor="middle" opacity="0.5">m</text>
    <!-- y 标注1 -->
    <text x="310" y="310" font-family="'SF Mono', 'Fira Code', monospace" font-size="22" fill="#37DCF2" text-anchor="middle" opacity="0.5">y</text>
    <!-- y 标注2 -->
    <text x="370" y="310" font-family="'SF Mono', 'Fira Code', monospace" font-size="22" fill="#37DCF2" text-anchor="middle" opacity="0.5">y</text>
  </g>
  
  <!-- 底部品牌名 -->
  <text x="260" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle" letter-spacing="10" opacity="0.6">SYMγ</text>
</svg>