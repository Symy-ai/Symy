<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#37DCF2" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="420" fill="#0A2647" rx="16"/>

  <!-- 地面线 -->
  <line x1="50" y1="365" x2="520" y2="365" stroke="#37DCF2" stroke-width="1" opacity="0.15"/>

  <!--
    核心理念：用连笔草书写 Symy，笔画本身构成大象轮廓
    面朝左的小象，从左到右一笔写出：
    S = 头顶弧线 + 鼻子向下卷曲
    m = 身体上下两个弧度
    y = 前两条腿（竖=左腿踩地，斜叉=右腿踩地）
    y = 后两条腿（同上）
  -->

  <g filter="url(#glow)" transform="translate(30, 5)">

    <!-- ═══════ S：头顶 + 鼻子 ═══════ -->
    <!-- S 的上弧 = 头顶，S 的下弧 = 鼻子 -->
    <path d="
      M 118 215
      C 122 188, 135 158, 155 138
      C 172 120, 195 112, 210 120
      C 225 128, 228 148, 218 165

      C 230 155, 238 138, 232 118
      C 225 98, 205 88, 185 92
      C 165 96, 152 115, 148 138
      C 145 155, 150 172, 162 185

      C 148 178, 132 168, 118 168
      C 100 168, 85 178, 82 195
      C 78 215, 90 232, 110 238
      C 125 242, 138 235, 142 222
    " fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 小耳朵（S头部的自然延伸） -->
    <path d="
      M 168 118
      C 148 105, 128 108, 118 125
      C 110 140, 115 158, 130 165
    " fill="none" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

    <!-- 眼睛 -->
    <circle cx="175" cy="132" r="6" fill="#0A2647"/>
    <circle cx="177" cy="130" r="2" fill="white" opacity="0.9"/>

    <!-- ═══════ m：圆润身体 ═══════ -->
    <!-- m 的左弧 = 胸腹部，m 的右弧 = 背臀部 -->
    <path d="
      M 162 185
      C 182 180, 208 188, 218 210
      C 228 232, 218 258, 198 268

      C 220 258, 248 248, 270 235
      C 295 218, 308 195, 305 170
      C 302 145, 280 132, 258 138
      C 238 144, 228 165, 235 188
      C 242 208, 262 218, 285 215

      C 308 210, 328 192, 338 170
      C 350 145, 345 118, 328 102
      C 312 88, 290 85, 272 95
      C 255 105, 248 125, 255 148
    " fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 尾巴（m 身体末梢自然甩出） -->
    <path d="
      M 345 115
      C 358 102, 372 105, 378 118
      C 382 128, 375 140, 365 135
    " fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- ═══════ 第一个 y：前腿 ═══════ -->
    <!-- y 的竖笔 = 前左腿，y 的斜叉 = 前右腿 -->
    <!-- 两条腿底部都踩到地面 y=365 -->

    <!-- y 的竖笔 = 前左腿 -->
    <path d="
      M 218 258
      C 222 275, 225 295, 225 320
      L 225 355
    " fill="none" stroke="white" stroke-width="16" stroke-linecap="round"/>

    <!-- 前左脚掌踩地 -->
    <path d="
      M 225 355
      C 222 362, 218 365, 212 365
      C 205 365, 200 360, 202 354
      C 204 348, 210 345, 218 348
      C 222 350, 225 352, 225 355
    " fill="white" stroke="none" opacity="0.92"/>

    <!-- y 的斜叉 = 前右腿（从分叉处斜下踩地） -->
    <path d="
      M 245 248
      C 255 265, 265 290, 272 320
      L 278 352
    " fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>

    <!-- 前右脚掌踩地 -->
    <path d="
      M 278 352
      C 276 358, 272 365, 266 365
      C 258 365, 255 360, 258 354
      C 260 348, 266 345, 274 348
      C 278 350, 280 352, 278 352
    " fill="white" stroke="none" opacity="0.92"/>

    <!-- ═══════ 第二个 y：后腿 ═══════ -->

    <!-- y 的竖笔 = 后左腿 -->
    <path d="
      M 328 195
      C 330 220, 332 250, 332 285
      L 332 355
    " fill="none" stroke="white" stroke-width="16" stroke-linecap="round"/>

    <!-- 后左脚掌踩地 -->
    <path d="
      M 332 355
      C 329 362, 325 365, 318 365
      C 312 365, 308 360, 310 354
      C 312 348, 318 345, 326 348
      C 330 350, 332 352, 332 355
    " fill="white" stroke="none" opacity="0.92"/>

    <!-- y 的斜叉 = 后右腿 -->
    <path d="
      M 350 185
      C 365 210, 378 248, 385 290
      L 392 352
    " fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>

    <!-- 后右脚掌踩地 -->
    <path d="
      M 392 352
      C 390 358, 386 365, 380 365
      C 372 365, 368 360, 370 354
      C 372 348, 378 345, 386 348
      C 390 350, 392 352, 392 352
    " fill="white" stroke="none" opacity="0.92"/>

  </g>

  <!-- 底部 slogan -->
  <text x="300" y="405" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#37DCF2" text-anchor="middle" letter-spacing="10" opacity="0.35">see me</text>
</svg>