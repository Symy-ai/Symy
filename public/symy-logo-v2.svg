<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <defs>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#37DCF2" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="420" fill="#0A2647" rx="20"/>

  <!-- Ground line - subtle -->
  <line x1="60" y1="350" x2="620" y2="350" stroke="#37DCF2" stroke-width="1.5" opacity="0.2" stroke-dasharray="8,6"/>

  <g filter="url(#glow)" transform="translate(50, 10)">
    <!--
      Symy 小象侧面 Logo v2
      一笔画大象，字母自然浮现：
      S = 头顶上弧 + 鼻子向下卷曲
      m = 身体的两个圆润弧度
      y y = 四条腿踩在地面上
    -->

    <!-- ═══ S：头 + 鼻子 ═══ -->
    <!-- S的上弧：从脖子向上走到头顶，再向前弯到额前 -->
    <path d="
      M 168 200
      C 168 175, 158 148, 135 128
      C 115 110, 90 105, 75 112
      C 58 120, 52 138, 58 155
      C 63 168, 78 175, 95 172
    " fill="none" stroke="white" stroke-width="22" stroke-linecap="round" opacity="0.95"/>

    <!-- S的下弧：鼻子从额头向下、向前卷曲——走S的弧线 -->
    <path d="
      M 95 172
      C 112 168, 125 155, 128 138
      C 132 118, 120 102, 105 98
      C 88 94, 72 102, 65 118
      C 60 130, 62 142, 72 152
      C 82 162, 95 168, 108 168
      C 118 168, 128 164, 135 158
    " fill="none" stroke="white" stroke-width="20" stroke-linecap="round" opacity="0.95"/>

    <!-- 鼻尖继续向下探——S的尾部自然延伸 -->
    <path d="
      M 135 158
      C 142 152, 148 142, 150 128
      C 152 112, 146 98, 135 90
      C 148 95, 160 110, 165 132
      C 170 155, 165 178, 155 192
      L 150 200
    " fill="none" stroke="white" stroke-width="16" stroke-linecap="round" opacity="0.9"/>

    <!-- 小耳朵 -->
    <path d="
      M 115 118
      C 98 108, 78 112, 68 128
      C 60 142, 62 158, 72 168
    " fill="none" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

    <!-- 眼睛 -->
    <circle cx="100" cy="132" r="6" fill="#0A2647"/>
    <circle cx="102" cy="130" r="2" fill="white" opacity="0.95"/>

    <!-- ═══ m：圆润身体 ═══ -->
    <!-- m的左弧 = 胸部弧线；m的右弧 = 臀部弧线 -->
    <path d="
      M 150 200
      C 155 185, 172 172, 195 168
      C 218 164, 238 172, 248 188

      C 238 165, 232 140, 238 118
      C 245 95, 268 82, 295 85
      C 322 88, 340 108, 342 138
      C 344 168, 328 195, 300 205

      C 322 198, 348 182, 365 158
      C 382 135, 385 108, 375 90
      C 365 72, 345 65, 325 70
      C 305 75, 292 92, 290 115

      C 288 135, 298 155, 318 168
    " fill="none" stroke="white" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- ═══ 第一个 y：前腿 ═══ -->
    <!-- y的主干 = 前左腿（笔直踩地） -->
    <!-- y的斜叉 = 前右腿（从分叉处斜下踩地） -->
    <path d="
      M 218 175
      C 222 195, 225 220, 225 250
      C 225 280, 225 310, 225 330
      C 225 340, 225 340, 220 340
    " fill="none" stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.95"/>

    <!-- 前左脚踩地 -->
    <path d="
      M 220 340
      C 215 342, 210 340, 210 338
      C 210 335, 215 332, 220 332
      C 228 332, 235 336, 235 340
      C 235 344, 228 348, 218 348
      C 206 348, 198 342, 198 336
      C 198 330, 206 326, 216 326
    " fill="none" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

    <!-- y的斜叉 = 前右腿 -->
    <path d="
      M 235 210
      C 245 230, 258 260, 268 290
      C 275 310, 280 325, 282 335
      C 283 340, 282 342, 278 342
    " fill="none" stroke="white" stroke-width="16" stroke-linecap="round" opacity="0.95"/>

    <!-- 前右脚踩地 -->
    <path d="
      M 278 342
      C 272 344, 268 342, 268 340
      C 268 337, 272 334, 276 334
      C 284 334, 292 338, 292 342
      C 292 346, 284 350, 275 350
      C 264 350, 258 344, 258 338
      C 258 332, 264 328, 274 328
    " fill="none" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

    <!-- ═══ 第二个 y：后腿 ═══ -->
    <!-- y的主干 = 后左腿 -->
    <path d="
      M 338 200
      C 340 225, 342 255, 342 285
      C 342 310, 342 330, 342 340
      C 342 342, 340 342, 338 340
    " fill="none" stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.95"/>

    <!-- 后左脚踩地 -->
    <path d="
      M 338 340
      C 332 344, 326 342, 326 340
      C 326 337, 332 334, 336 334
      C 344 334, 352 338, 352 342
      C 352 346, 344 350, 335 350
      C 324 350, 318 344, 318 338
      C 318 332, 324 328, 334 328
    " fill="none" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

    <!-- y的斜叉 = 后右腿 -->
    <path d="
      M 358 215
      C 370 240, 385 270, 395 300
      C 402 320, 408 335, 410 340
      C 411 342, 410 344, 406 344
    " fill="none" stroke="white" stroke-width="16" stroke-linecap="round" opacity="0.95"/>

    <!-- 后右脚踩地 -->
    <path d="
      M 406 344
      C 400 346, 396 344, 396 342
      C 396 339, 400 336, 404 336
      C 412 336, 420 340, 420 344
      C 420 348, 412 352, 403 352
      C 392 352, 386 346, 386 340
      C 386 334, 392 330, 402 330
    " fill="none" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

    <!-- 尾巴（m身体末梢自然甩出） -->
    <path d="
      M 388 95
      C 402 85, 415 88, 420 102
      C 424 112, 418 122, 408 118
      C 400 115, 398 108, 402 100
    " fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  </g>

  <!-- 底部 slogan -->
  <text x="350" y="400" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#37DCF2" text-anchor="middle" letter-spacing="8" opacity="0.5">see me</text>
</svg>